<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - WC Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-gray-50 p-4">
  <div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
      <a href="index.html" class="text-emerald-600 hover:underline text-sm">← Back to App</a>
    </div>
    
    <div id="admin-content" class="hidden space-y-6">
      <!-- Add Fixture -->
      <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="font-bold mb-4 text-lg">Add Fixture</h2>
        <form id="add-fixture-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="home-team" placeholder="Home Team (e.g. Brazil)" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <input type="text" id="away-team" placeholder="Away Team (e.g. Argentina)" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <input type="datetime-local" id="kickoff" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <input type="text" id="stage" placeholder="Stage (e.g. Group A, Round of 16)" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <button type="submit" 
            class="md:col-span-2 bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700 active:scale-95 transition">
            Add Fixture
          </button>
        </form>
      </div>
      
      <!-- Update Scores -->
      <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="font-bold mb-4 text-lg">Enter Final Scores</h2>
        <div id="admin-fixtures" class="space-y-3"></div>
      </div>
    </div>
    
    <div id="access-denied" class="hidden text-center py-12">
      <div class="text-4xl mb-4">🚫</div>
      <h2 class="text-xl font-bold text-gray-800">Access Denied</h2>
      <p class="text-gray-500 mt-2">You are not an admin.</p>
    </div>
    
    <div id="loading" class="text-center py-12 text-gray-500">Loading...</div>
  </div>

  <script>
    const pendingScores = {}

    async function init() {
      const auth = await initAuth()
      
      if (!getUser()) {
        window.location.href = 'index.html'
        return
      }
      
      document.getElementById('loading').classList.add('hidden')
      
      if (isAdmin()) {
        document.getElementById('admin-content').classList.remove('hidden')
        loadFixtures()
      } else {
        document.getElementById('access-denied').classList.remove('hidden')
      }
    }

    async function loadFixtures() {
      const { data } = await getFixtures()
      const container = document.getElementById('admin-fixtures')
      
      if (!data?.length) {
        container.innerHTML = '<p class="text-gray-500 py-4">No fixtures yet.</p>'
        return
      }
      
      container.innerHTML = data.map(f => `
        <div class="border border-gray-200 rounded-lg p-4 flex flex-col md:flex-row md:items-center gap-4">
          <div class="flex-1">
            <div class="font-bold text-lg">${f.home_team} vs ${f.away_team}</div>
            <div class="text-sm text-gray-500">${f.stage} • ${new Date(f.kickoff).toLocaleString()}</div>
          </div>
          <div class="flex items-center gap-2">
            <input type="number" min="0" placeholder="H" 
              class="w-16 text-center border border-gray-300 rounded-lg py-2 font-bold" 
              value="${f.home_score !== null ? f.home_score : ''}" 
              onchange="updateScore('${f.id}', 'home', this.value)">
            <span class="text-gray-400 font-bold">-</span>
            <input type="number" min="0" placeholder="A" 
              class="w-16 text-center border border-gray-300 rounded-lg py-2 font-bold" 
              value="${f.away_score !== null ? f.away_score : ''}" 
              onchange="updateScore('${f.id}', 'away', this.value)">
          </div>
          <button onclick="handleSaveScore('${f.id}')" 
            class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-800 active:scale-95 transition">
            Save
          </button>
        </div>
      `).join('')
    }

    function updateScore(id, side, val) {
      if (!pendingScores[id]) pendingScores[id] = {}
      pendingScores[id][side] = val === '' ? null : parseInt(val)
    }

    async function handleSaveScore(id) {
      const s = pendingScores[id] || {}
      const homeScore = s.home
      const awayScore = s.away
      
      if (homeScore === undefined && awayScore === undefined) return
      
      const { error } = await updateFixtureScore(id, homeScore, awayScore)
      
      if (error) {
        alert('Error: ' + error.message)
      } else {
        alert('✅ Score saved! Points auto-calculated.')
        pendingScores[id] = {}
        loadFixtures()
      }
    }

    document.getElementById('add-fixture-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      
      const { error } = await addFixture({
        home_team: document.getElementById('home-team').value,
        away_team: document.getElementById('away-team').value,
        kickoff: new Date(document.getElementById('kickoff').value).toISOString(),
        stage: document.getElementById('stage').value
      })
      
      if (error) {
        alert('Error: ' + error.message)
      } else {
        alert('✅ Fixture added!')
        e.target.reset()
        loadFixtures()
      }
    })

    init()
  </script>
</body>
</html>
