<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Admin - WC Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="/assets/js/auth.js"></script>
  <style>
    .tap-active:active { transform: scale(0.96); }
    .toast-enter { transform: translateY(100%); opacity: 0; }
    .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal-backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="bg-gray-50 p-4">
  
  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="fixed top-4 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- MODAL -->
  <div id="modal-overlay" class="fixed inset-0 modal-backdrop z-50 hidden flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 transform scale-95 opacity-0 transition-all duration-200">
      <div id="modal-icon" class="text-4xl text-center mb-4"></div>
      <h3 id="modal-title" class="text-lg font-bold text-center text-gray-900 mb-2"></h3>
      <p id="modal-message" class="text-sm text-gray-600 text-center mb-6"></p>
      <div id="modal-actions" class="flex gap-3"></div>
    </div>
  </div>

  <div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
      <a href="index.html" class="text-emerald-600 hover:underline text-sm">← Back to App</a>
    </div>
    
    <div id="admin-content" class="hidden space-y-6">
      <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="font-bold mb-4 text-lg">Add Fixture</h2>
        <form id="add-fixture-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="home-team" placeholder="Home Team (e.g. Brazil)" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <input type="text" id="away-team" placeholder="Away Team (e.g. Argentina)" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <input type="datetime-local" id="kickoff" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <input type="text" id="stage" placeholder="Stage (e.g. Group A, Round of 16)" required 
            class="px-4 py-2 border border-gray-300 rounded-lg focus:border-emerald-500 outline-none">
          <button type="submit" 
            class="md:col-span-2 bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700 active:scale-95 transition tap-active">
            Add Fixture
          </button>
        </form>
      </div>
      
      <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="font-bold mb-4 text-lg">Enter Final Scores</h2>
        <div id="admin-fixtures" class="space-y-3"></div>
      </div>
    </div>
    
    <div id="access-denied" class="hidden text-center py-12">
      <div class="text-4xl mb-4">🚫</div>
      <h2 class="text-xl font-bold text-gray-800">Access Denied</h2>
      <p class="text-gray-500 mt-2">You are not an admin.</p>
    </div>
    
    <div id="loading" class="text-center py-12 text-gray-500">Loading...</div>
  </div>

  <script>
    const pendingScores = {}

    // Toast system
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container')
      const toast = document.createElement('div')
      
      const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' }
      const colors = { success: 'bg-emerald-600', error: 'bg-red-500', info: 'bg-blue-500', warning: 'bg-amber-500' }
      
      toast.className = `toast-enter ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium pointer-events-auto`
      toast.innerHTML = `<span class="text-lg">${icons[type]}</span><span>${message}</span>`
      
      container.appendChild(toast)
      requestAnimationFrame(() => {
        toast.classList.remove('toast-enter')
        toast.classList.add('toast-enter-active')
      })
      
      setTimeout(() => {
        toast.classList.remove('toast-enter-active')
        toast.classList.add('toast-exit-active')
        setTimeout(() => toast.remove(), 300)
      }, 3000)
    }

    // Modal system
    function showModal({ icon, title, message, actions }) {
      const overlay = document.getElementById('modal-overlay')
      const content = document.getElementById('modal-content')
      
      document.getElementById('modal-icon').textContent = icon
      document.getElementById('modal-title').textContent = title
      document.getElementById('modal-message').textContent = message
      document.getElementById('modal-actions').innerHTML = actions.map(btn => `
        <button onclick="${btn.onclick}" 
          class="flex-1 py-3 rounded-xl font-semibold text-sm transition active:scale-95 ${btn.class}">
          ${btn.text}
        </button>
      `).join('')
      
      overlay.classList.remove('hidden')
      requestAnimationFrame(() => {
        content.classList.remove('scale-95', 'opacity-0')
        content.classList.add('scale-100', 'opacity-100')
      })
    }

    function hideModal() {
      const overlay = document.getElementById('modal-overlay')
      const content = document.getElementById('modal-content')
      content.classList.remove('scale-100', 'opacity-100')
      content.classList.add('scale-95', 'opacity-0')
      setTimeout(() => overlay.classList.add('hidden'), 200)
    }

    async function init() {
      const auth = await initAuth()
      
      if (!getUser()) {
        window.location.href = 'index.html'
        return
      }
      
      document.getElementById('loading').classList.add('hidden')
      
      if (isAdmin()) {
        document.getElementById('admin-content').classList.remove('hidden')
        loadFixtures()
      } else {
        document.getElementById('access-denied').classList.remove('hidden')
      }
    }

    async function loadFixtures() {
      const { data } = await getFixtures()
      const container = document.getElementById('admin-fixtures')
      
      if (!data?.length) {
        container.innerHTML = '<p class="text-gray-500 py-4">No fixtures yet.</p>'
        return
      }
      
      container.innerHTML = data.map(f => `
        <div class="border border-gray-200 rounded-lg p-4 flex flex-col md:flex-row md:items-center gap-4">
          <div class="flex-1">
            <div class="font-bold text-lg">${f.home_team} vs ${f.away_team}</div>
            <div class="text-sm text-gray-500">${f.stage} • ${new Date(f.kickoff).toLocaleString()}</div>
          </div>
          <div class="flex items-center gap-2">
            <input type="number" min="0" placeholder="H" 
              class="w-16 text-center border border-gray-300 rounded-lg py-2 font-bold" 
              value="${f.home_score !== null ? f.home_score : ''}" 
              onchange="updateScore('${f.id}', 'home', this.value)">
            <span class="text-gray-400 font-bold">-</span>
            <input type="number" min="0" placeholder="A" 
              class="w-16 text-center border border-gray-300 rounded-lg py-2 font-bold" 
              value="${f.away_score !== null ? f.away_score : ''}" 
              onchange="updateScore('${f.id}', 'away', this.value)">
          </div>
          <button onclick="confirmSaveScore('${f.id}')" 
            class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-800 active:scale-95 transition tap-active">
            Save
          </button>
        </div>
      `).join('')
    }

    function updateScore(id, side, val) {
      if (!pendingScores[id]) pendingScores[id] = {}
      pendingScores[id][side] = val === '' ? null : parseInt(val)
    }

    function confirmSaveScore(id) {
      const s = pendingScores[id] || {}
      if (s.home === undefined && s.away === undefined) {
        showToast('No score changes to save', 'warning')
        return
      }
      
      showModal({
        icon: '⚽',
        title: 'Confirm Score',
        message: `Save final score for this match?`,
        actions: [
          { text: 'Cancel', onclick: 'hideModal()', class: 'bg-gray-100 text-gray-700 hover:bg-gray-200' },
          { text: 'Confirm', onclick: `hideModal(); executeSaveScore('${id}')`, class: 'bg-emerald-600 text-white hover:bg-emerald-700' }
        ]
      })
    }

    async function executeSaveScore(id) {
      const s = pendingScores[id] || {}
      const homeScore = s.home
      const awayScore = s.away
      
      const { error } = await updateFixtureScore(id, homeScore, awayScore)
      
      if (error) {
        showToast('Error: ' + error.message, 'error')
      } else {
        showToast('Score saved! Points calculated.', 'success')
        pendingScores[id] = {}
        loadFixtures()
      }
    }

    document.getElementById('add-fixture-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      
      const { error } = await addFixture({
        home_team: document.getElementById('home-team').value,
        away_team: document.getElementById('away-team').value,
        kickoff: new Date(document.getElementById('kickoff').value).toISOString(),
        stage: document.getElementById('stage').value
      })
      
      if (error) {
        showToast('Error: ' + error.message, 'error')
      } else {
        showToast('Fixture added!', 'success')
        e.target.reset()
        loadFixtures()
      }
    })

    init()
  </script>
</body>
</html>
